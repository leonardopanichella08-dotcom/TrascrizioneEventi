# Blueprint per il deploy su Render (https://render.com).
# Un solo servizio web: il backend Node/Socket.io, che serve anche il frontend
# statico (pagina di ingresso, dashboard speaker, display) dalla stessa origine.
#
# Deploy: su Render -> New -> Blueprint -> collega questo repo. Render legge
# questo file e configura tutto da solo. Nessuna variabile segreta richiesta.
services:
  - type: web
    name: trascrizione-eventi
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGIN
        value: "*"
      - key: SPEAKER_GRACE_PERIOD_SECONDS
        value: "60"
      - key: ROOM_MAX_IDLE_HOURS
        value: "6"
      # Facoltativa: una tua email alza la quota gratuita di MyMemory da
      # ~5.000 a ~50.000 parole/giorno. Lasciala vuota per non usarla.
      # Lo streaming parola-per-parola consuma molte piu' traduzioni: senza
      # questa (o un traduttore a pagamento) la quota dura pochi minuti di
      # parlato continuo, poi i sottotitoli mostrano il testo NON tradotto.
      - key: MYMEMORY_EMAIL
        value: ""
